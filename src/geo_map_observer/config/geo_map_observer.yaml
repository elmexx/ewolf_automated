gnss_position_node:
  ros__parameters:
    gnss_fix_topic: /gnss/fix
    require_fix_status: false
    enable_gnss_position_log: false
    gnss_position_log_interval_sec: 1.0
    enable_road_match_log: true
    road_match_log_interval_sec: 1.0
    enable_status_warning_log: true
    status_warning_log_interval_sec: 10.0
    enable_road_matching: true
    enable_road_topology: true
    junction_branch_merge_angle_deg: 20.0
    enable_topology_summary_log: true
    enable_junction_candidate_log: false
    max_match_distance_m: 20.0
    drivable_highway_types:
      - motorway
      - motorway_link
      - trunk
      - trunk_link
      - primary
      - primary_link
      - secondary
      - secondary_link
      - tertiary
      - tertiary_link
      - unclassified
      - residential
      - living_street
      - service
    subscribe_gnss_status: false
    subscribe_gnss_quality: false
    map_file: "/home/fmon005/ros2_ws_foxy/map/map.osm"
    enable_visualization: false
    visualization_output_dir: "/tmp/geo_map_observer_visualization"
    visualization_update_interval_sec: 0.5
    visualization_max_track_points: 10000
    visualization_export_contextual_highways: true
    visualization_export_drivable_highways: true
    visualization_export_topology_candidates: false
    visualization_follow_vehicle_default: true
